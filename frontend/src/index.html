<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Sistema Regional de Registros de Transporte Terrestre (SIRRETT)</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema Regional de Registros de Transporte Terrestre (SIRRETT) - Dirección Regional de Transportes y Comunicaciones de Puno">
  <meta name="theme-color" content="#1976d2">
  
  <!-- PWA deshabilitado - No se requieren funcionalidades offline -->
  

  
  <!-- DNS prefetch para APIs externas -->
  <link rel="dns-prefetch" href="//fonts.googleapis.com">
  <link rel="dns-prefetch" href="//fonts.gstatic.com">
  
  <!-- Preconnect para conexiones críticas -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Material Design Icons & Symbols -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Sharp" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Two+Tone" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  
  <!-- Google Fonts - Inter, Space Grotesk & Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Material Design Theme - Restaurado -->
  <link href="https://unpkg.com/@angular/material@20.1.5/prebuilt-themes/indigo-pink.css" rel="stylesheet">
  
  <!-- Favicon y iconos -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  

  
  <!-- Estilos críticos inline para mejor rendimiento -->
  <style>
    /* ── PRECARGA ULTRA MODERNA SIRRETT (DRTC PUNO) ── */
    .app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 28%, #172554 0%, #0a1122 45%, #050811 100%);
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      z-index: 99999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s ease;
      overflow: hidden;
    }

    .loading-ambient-glow {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(37, 99, 235, 0.22) 0%, rgba(6, 182, 212, 0.08) 50%, transparent 70%);
      pointer-events: none;
      filter: blur(60px);
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9) translate(-20px, -10px); opacity: 0.6; }
      100% { transform: scale(1.15) translate(20px, 15px); opacity: 0.95; }
    }

    .loading-card {
      position: relative;
      background: rgba(13, 27, 56, 0.78);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(59, 130, 246, 0.28);
      border-radius: 24px;
      padding: 42px 46px;
      max-width: 480px;
      width: 88%;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.75), 0 0 50px rgba(37, 99, 235, 0.2);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }

    .loading-orbit {
      position: relative;
      width: 84px;
      height: 84px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .loading-orbit-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #38bdf8;
      border-right-color: #2563eb;
      animation: orbitRotate 1.3s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.45);
    }

    .loading-orbit-ring-secondary {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 2px dashed rgba(96, 165, 250, 0.35);
      animation: orbitRotateRev 3.5s linear infinite;
    }

    .loading-emblem-icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1e3a8a 0%, #0b172a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(147, 197, 253, 0.4);
      box-shadow: 0 0 16px rgba(37, 99, 235, 0.5);
      z-index: 2;
    }

    @keyframes orbitRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes orbitRotateRev {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }

    .loading-gov-badge {
      display: inline-flex;
      align-items: center;
      background: rgba(37, 99, 235, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.35);
      color: #93c5fd;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.12em;
      padding: 4px 14px;
      border-radius: 9999px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .loading-title {
      margin: 0;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #ffffff 0%, #93c5fd 60%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 20px rgba(56, 189, 248, 0.3);
      line-height: 1.15;
    }

    .loading-subtitle {
      margin: 6px 0 24px 0;
      font-size: 13px;
      color: #94a3b8;
      font-weight: 400;
      letter-spacing: 0.02em;
      line-height: 1.4;
    }

    .loading-progress-container {
      width: 100%;
      margin-bottom: 20px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 12.5px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #cbd5e1;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 320px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseDot 1.4s ease-in-out infinite alternate;
      flex-shrink: 0;
    }

    @keyframes pulseDot {
      0% { opacity: 0.5; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1.15); box-shadow: 0 0 14px #10b981; }
    }

    .loading-percentage {
      font-family: 'Space Grotesk', monospace, sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      min-width: 48px;
      text-align: right;
    }

    .progress-track {
      width: 100%;
      height: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 9999px;
      overflow: hidden;
      position: relative;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563eb 0%, #06b6d4 50%, #10b981 100%);
      border-radius: 9999px;
      box-shadow: 0 0 14px rgba(6, 182, 212, 0.7);
      transition: width 0.1s linear;
      position: relative;
    }

    .progress-fill::after {
      content: '';
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      animation: shimmerSweep 1.6s infinite;
    }

    @keyframes shimmerSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .loading-footer-tags {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #64748b;
      font-weight: 500;
    }

    .loading-footer-tags .sep {
      color: #334155;
    }
    
    /* Optimizaciones de rendimiento */
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }
    
    /* Optimización de scroll */
    html {
      scroll-behavior: smooth;
    }
    
    /* Optimización de imágenes */
    img {
      max-width: 100%;
      height: auto;
    }
    
    /* Asegurar que Material Icons se carguen correctamente */
    .material-icons {
      font-family: 'Material Icons';
      font-weight: normal;
      font-style: normal;
      font-size: 24px;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-block;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased;
    }
    
    
    /* Optimización de fuentes */
    /* Usamos Roboto desde Google Fonts (arriba). Eliminadas fuentes locales inexistentes para evitar 404. */
  </style>
</head>
<body>
    <!-- Pantalla de carga inicial Ultra-Moderna SIRRETT -->
  <div id="app-loading" class="app-loading">
    <div class="loading-ambient-glow"></div>
    <div class="loading-card">
      <div class="loading-gov-badge">GOBIERNO REGIONAL PUNO • DRTC</div>
      <div class="loading-orbit">
        <div class="loading-orbit-ring"></div>
        <div class="loading-orbit-ring-secondary"></div>
        <div class="loading-emblem-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="15" rx="3"></rect>
            <path d="M3 9h18"></path>
            <circle cx="7.5" cy="14.5" r="1.5" fill="#60a5fa"></circle>
            <circle cx="16.5" cy="14.5" r="1.5" fill="#60a5fa"></circle>
            <path d="M5 18v2"></path>
            <path d="M19 18v2"></path>
          </svg>
        </div>
      </div>
      <h1 class="loading-title">SIRRETT</h1>
      <p class="loading-subtitle">Sistema Regional de Registros de Transporte Terrestre</p>
      
      <div class="loading-progress-container">
        <div class="progress-meta">
          <span class="status-indicator">
            <span class="pulse-dot"></span>
            <span id="loading-status-text">Iniciando plataforma SIRRETT...</span>
          </span>
          <span id="loading-percentage-number" class="loading-percentage">0%</span>
        </div>
        <div class="progress-track">
          <div id="loading-progress-bar" class="progress-fill"></div>
        </div>
      </div>

      <div class="loading-footer-tags">
        <span>D.S. 017-2009-MTC</span>
        <span class="sep">•</span>
        <span>Operadores Habilitados 360°</span>
        <span class="sep">•</span>
        <span>v2.4 Oficial</span>
      </div>
    </div>
  </div>
  
  <!-- Root de la aplicación Angular -->
  <app-root></app-root>
  
  <!-- Scripts de optimización -->
  <script>
    // Optimizaciones de rendimiento antes de que Angular se cargue
    
    // Prevenir layout shift
    document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    window.addEventListener('resize', () => {
      document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
    });
    
    // Optimización de scroll
    let ticking = false;
    function updateScroll() {
      ticking = false;
    }
    
    function requestTick() {
      if (!ticking) {
        requestAnimationFrame(updateScroll);
        ticking = true;
      }
    }
    
    window.addEventListener('scroll', requestTick, { passive: true });
    

    
    // Optimización de imágenes
    if ('IntersectionObserver' in window) {
      const imageObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const img = entry.target;
            if (img.dataset.src) {
              img.src = img.dataset.src;
              img.classList.remove('lazy');
              imageObserver.unobserve(img);
            }
          }
        });
      });
      
      // Observar imágenes lazy
      document.querySelectorAll('img[data-src]').forEach(img => {
        imageObserver.observe(img);
      });
    }
    
    // Verificar carga de Material Icons
    function checkMaterialIcons() {
      const testIcon = document.createElement('span');
      testIcon.className = 'material-icons';
      testIcon.textContent = 'home';
      testIcon.style.position = 'absolute';
      testIcon.style.left = '-9999px';
      document.body.appendChild(testIcon);
      
      const iconWidth = testIcon.offsetWidth;
      document.body.removeChild(testIcon);
      
      if (iconWidth < 10) {
        console.warn('⚠️ Material Icons no se cargaron correctamente, usando fallback');
        document.body.classList.add('material-icons-fallback');
      } else {
        console.log('✅ Material Icons cargados correctamente');
      }
    }
    
// Control Dinámico de Precarga con Porcentaje y Transición Fluida
    (function() {
      let currentProgress = 0;
      let targetProgress = 25;
      let isAppLoaded = false;
      
      const progressBar = document.getElementById('loading-progress-bar');
      const percentageText = document.getElementById('loading-percentage-number');
      const statusText = document.getElementById('loading-status-text');
      const loadingElement = document.getElementById('app-loading');

      const messages = [
        { max: 25, msg: 'Conectando con base de datos DRTC Puno...' },
        { max: 55, msg: 'Cargando padrón oficial y operadores...' },
        { max: 80, msg: 'Sincronizando servicios interoperables (MTC / SUNAT)...' },
        { max: 96, msg: 'Optimizando interfaz y componentes...' },
        { max: 100, msg: '¡Bienvenido a SIRRETT!' }
      ];

      function updateStatus(val) {
        for (let i = 0; i < messages.length; i++) {
          if (val <= messages[i].max) {
            if (statusText) statusText.textContent = messages[i].msg;
            break;
          }
        }
      }

      function updateUI(p) {
        const rounded = Math.min(100, Math.round(p));
        if (progressBar) progressBar.style.width = rounded + '%';
        if (percentageText) percentageText.textContent = rounded + '%';
        updateStatus(rounded);
      }

      const progressInterval = setInterval(() => {
        if (!isAppLoaded) {
          if (currentProgress < 90) {
            currentProgress += (targetProgress - currentProgress) * 0.12 + Math.random() * 2.2;
            targetProgress = Math.min(94, targetProgress + Math.random() * 4);
            updateUI(currentProgress);
          }
        }
      }, 70);

      window.finishLoadingScreen = function() {
        if (isAppLoaded) return;
        isAppLoaded = true;
        clearInterval(progressInterval);

        let finalP = currentProgress;
        const finishAnim = setInterval(() => {
          finalP += (100 - finalP) * 0.35 + 4;
          if (finalP >= 100) {
            finalP = 100;
            clearInterval(finishAnim);
            updateUI(100);

            setTimeout(() => {
              if (loadingElement) {
                loadingElement.style.opacity = '0';
                loadingElement.style.transform = 'scale(1.03)';
                loadingElement.style.filter = 'blur(6px)';
                loadingElement.style.pointerEvents = 'none';
                setTimeout(() => {
                  if (loadingElement.parentNode) {
                    loadingElement.parentNode.removeChild(loadingElement);
                  }
                }, 520);
              }
            }, 260);
          } else {
            updateUI(finalP);
          }
        }, 30);
      };

      // Si Angular monta antes de 4s
      window.addEventListener('DOMContentLoaded', () => {
        setTimeout(() => {
          window.finishLoadingScreen();
        }, 900);
      });

      // Fallback
      window.addEventListener('load', () => {
        setTimeout(() => {
          window.finishLoadingScreen();
        }, 1200);
      });
    })();
    setTimeout(checkMaterialIcons, 1000);
  </script>
  
  <!-- Script de limpieza de autenticación -->
  <script src="assets/scripts/cleanup-auth.js"></script>
  
  <!-- NoScript fallback -->
  <noscript>
    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
      <h1>JavaScript Requerido</h1>
      <p>Esta aplicación requiere JavaScript para funcionar correctamente.</p>
      <p>Por favor, habilite JavaScript en su navegador y recargue la página.</p>
    </div>
  </noscript>
</body>
</html>
